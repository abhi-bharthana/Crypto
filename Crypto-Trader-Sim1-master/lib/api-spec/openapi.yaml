openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Crypto Trading Simulator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trading
    description: Trading operations
  - name: portfolio
    description: Portfolio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /portfolio:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      summary: Get portfolio
      description: Returns the user's simulated portfolio
      responses:
        "200":
          description: Portfolio data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
  /orders:
    get:
      operationId: getOrders
      tags: [trading]
      summary: Get all orders
      description: Returns all placed orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: placeOrder
      tags: [trading]
      summary: Place an order
      description: Place a buy or sell order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{orderId}:
    delete:
      operationId: cancelOrder
      tags: [trading]
      summary: Cancel an order
      description: Cancel a pending order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portfolio/reset:
    post:
      operationId: resetPortfolio
      tags: [portfolio]
      summary: Reset portfolio
      description: Reset portfolio to initial state
      responses:
        "200":
          description: Portfolio reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Portfolio:
      type: object
      properties:
        usdBalance:
          type: number
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/Holding"
        totalValue:
          type: number
        pnl:
          type: number
        pnlPercent:
          type: number
      required:
        - usdBalance
        - holdings
        - totalValue
        - pnl
        - pnlPercent
    Holding:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          type: number
        averageCost:
          type: number
        currentValue:
          type: number
        pnl:
          type: number
      required:
        - symbol
        - quantity
        - averageCost
        - currentValue
        - pnl
    Order:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [buy, sell]
        type:
          type: string
          enum: [market, limit, stop_limit, stop_market]
        quantity:
          type: number
        price:
          type: number
          nullable: true
        stopPrice:
          type: number
          nullable: true
        status:
          type: string
          enum: [pending, filled, cancelled, rejected]
        filledPrice:
          type: number
          nullable: true
        filledAt:
          type: string
          nullable: true
        createdAt:
          type: string
        total:
          type: number
          nullable: true
      required:
        - id
        - symbol
        - side
        - type
        - quantity
        - status
        - createdAt
    PlaceOrderRequest:
      type: object
      properties:
        symbol:
          type: string
          enum: [BTCUSDT, ETHUSDT, SHIBUSDT]
        side:
          type: string
          enum: [buy, sell]
        type:
          type: string
          enum: [market, limit, stop_limit, stop_market]
        quantity:
          type: number
        price:
          type: number
          nullable: true
        stopPrice:
          type: number
          nullable: true
        marketPrice:
          type: number
          description: Current market price for market/stop_market orders
      required:
        - symbol
        - side
        - type
        - quantity
        - marketPrice
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

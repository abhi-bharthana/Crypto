kind = "web"
previewPath = "/"
title = "Crypto Trading Simulator"
version = "1.0.0"
id = "artifacts/crypto-trading"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20958
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/crypto-trading run dev"

[services.env]
PORT = "20958"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/crypto-trading", "run", "build"]
publicDir = "artifacts/crypto-trading/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
